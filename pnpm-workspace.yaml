allowBuilds:
  sharp: true
  unrs-resolver: true

# Keep these pins until Next.js declares patched compatible versions:
# - postcss >=8.5.18 fixes GHSA-6g55-p6wh-862q, GHSA-r28c-9q8g-f849, and
#   GHSA-qx2v-qp2m-jg93.
# - sharp >=0.35.0 fixes inherited libvips vulnerabilities tracked by
#   GHSA-f88m-g3jw-g9cj.

overrides:
  postcss: 8.5.23
  sharp: 0.35.0
  browserslist: 4.28.7
  'minimatch@3>brace-expansion': 1.1.18
  'minimatch@10>brace-expansion': 5.0.9

minimumReleaseAgeExclude:
  - '@next/eslint-plugin-next@16.3.0'
  - eslint-config-next@16.3.0